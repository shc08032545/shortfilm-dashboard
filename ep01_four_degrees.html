<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>คืนสี่องศาหน้าเกต — Production Dashboard</title>
<style>
:root{
  --bg:#0c1118;--panel:#131a24;--panel2:#192230;--border:#253143;
  --text:#e8eef6;--muted:#93a4b8;--accent:#f59e0b;--accent2:#38bdf8;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--pill:#1e293b;
  --code:#0a0f16;
}
body.light{
  --bg:#f4f6f9;--panel:#ffffff;--panel2:#eef2f7;--border:#d8e0eb;
  --text:#0f172a;--muted:#526277;--accent:#d97706;--accent2:#0284c7;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--pill:#e2e8f0;
  --code:#f8fafc;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
header{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.top-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
h1{margin:0;font-size:22px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--pill);border:1px solid var(--border);color:var(--text)}
.badge.accent{border-color:rgba(245,158,11,.45);color:var(--accent)}
.badge.ok{border-color:rgba(34,197,94,.45);color:var(--ok)}
.badge.warn{border-color:rgba(245,158,11,.45);color:var(--warn)}
.badge.bad{border-color:rgba(239,68,68,.45);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pbar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--ok));transition:width .25s}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#111827}
.btn.primary:hover{filter:brightness(1.08)}
.btn.copied{background:var(--ok)!important;border-color:var(--ok)!important;color:#052e16!important}
.btn.sm{padding:5px 9px;font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border)}
.tab{cursor:pointer;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:600;font-size:13px}
.tab.active{background:var(--accent2);border-color:var(--accent2);color:#082f49}
.panel{display:none}
.panel.active{display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.card.done{border-color:rgba(34,197,94,.45)}
.card-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.scene-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--border);font-weight:800;font-size:14px;color:var(--accent)}
.title-wrap{display:flex;gap:10px;align-items:center}
.scene-title{font-size:16px;font-weight:700}
.scene-meta{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--border)}
.chk input{accent-color:var(--ok);cursor:pointer}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--panel2)}
.ref.char{border-color:rgba(56,189,248,.45);color:var(--accent2)}
.ref.loc{border-color:rgba(245,158,11,.45);color:var(--accent)}
.ref.prop{border-color:rgba(168,85,247,.45);color:#c084fc}
.ref.prev{border-color:rgba(34,197,94,.4);color:var(--ok)}
.tbar{display:flex;gap:3px;height:28px;border-radius:8px;overflow:hidden;margin:10px 0 8px;background:var(--code);padding:3px;border:1px solid var(--border)}
.seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:5px;white-space:nowrap;overflow:hidden;padding:0 4px;cursor:default}
.seg.silent{background:rgba(148,163,184,.18);color:var(--muted)}
.seg.talk{background:rgba(56,189,248,.28);color:var(--text);border:1px solid rgba(56,189,248,.5)}
.dlgs{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.dlg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:13px;background:var(--panel2);padding:5px 9px;border-radius:7px}
.dlg-t{font-family:monospace;font-size:11.5px;color:var(--muted);min-width:80px}
.dlg-s{font-weight:700;color:var(--accent2);min-width:58px}
.dlg-r{margin-left:auto;font-family:monospace;font-size:11.5px;color:var(--muted)}
.dlg-r.tight{color:var(--warn);font-weight:700}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;user-select:none}
pre{background:var(--code);border:1px solid var(--border);border-radius:9px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:420px;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:700;background:var(--panel2)}
.hook-bar{position:relative;height:44px;background:var(--code);border:1px solid var(--border);border-radius:10px;display:flex;gap:3px;padding:4px;margin:14px 0 26px}
.marker{position:absolute;top:-6px;bottom:-22px;width:2px;pointer-events:none}
.marker span{position:absolute;bottom:0;left:4px;font-size:11px;font-weight:700;white-space:nowrap}
.warn-item{padding:9px 12px;border-radius:9px;margin-bottom:7px;border:1px solid var(--border);background:var(--panel2);display:flex;gap:8px;align-items:flex-start}
.warn-item.high{border-color:rgba(239,68,68,.55)}
.warn-item.medium{border-color:rgba(245,158,11,.55)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.asset-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--border)}
.asset-row:last-child{border-bottom:none}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ok);color:#052e16;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top-row">
      <div>
        <h1 id="h-title"></h1>
        <div class="sub" id="h-sub"></div>
        <div class="badges" id="h-badges"></div>
      </div>
      <div class="actions">
        <button class="btn sm" id="btn-theme">🌓 สลับธีม</button>
        <button class="btn sm" id="btn-reset">↺ รีเซ็ตติ๊ก</button>
      </div>
    </div>
    <div class="stats" id="h-stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="scenes">🎬 Scenes (15)</button>
    <button class="tab" data-tab="assets">🎨 Assets & QA</button>
    <button class="tab" data-tab="hook">⚡ Hook 3 วิแรก</button>
    <button class="tab" data-tab="bible">🔐 Master Lock & บทพูด</button>
    <button class="tab" data-tab="post">📣 ปก & โพสต์</button>
  </nav>

  <section id="tab-scenes" class="panel active"></section>
  <section id="tab-assets" class="panel"></section>
  <section id="tab-hook" class="panel"></section>
  <section id="tab-bible" class="panel"></section>
  <section id="tab-post" class="panel"></section>
</div>
<div class="toast" id="toast">คัดลอกแล้ว</div>

<script>
const D = {"prefix": "four_degrees_at_the_gate", "title_th": "คืนสี่องศาหน้าเกต", "title_en": "FOUR DEGREES AT THE GATE", "genre": "ดราม่าอบอุ่นจากข่าวไฟลต์ยกเลิกกลางดึก (news-inspired human drama)", "logline": "เมื่อเที่ยวบินกลับไทยถูกยกเลิกกลางดึกในอากาศ 4 องศา ครูพี่เลี้ยงเข้าใจผิดว่าลุงผู้โดยสารคนไทยหน้าเคร่งขรึมหวงถุงนอนสองผืนสุดท้ายไว้คนเดียว จนกระทั่งตีสามที่ความจริงเปิดเผยว่าลุงเก็บไว้ให้เด็กนักเรียนและส่งต่อน้ำใจจากความทรงจำของลูกสาวตัวเอง", "arc": "ไฟลต์ยกเลิกกลางดึก (1) → ลุงหยิบถุงนอนสองผืนสุดท้าย (2) → หนาว 4 องศาหน้ากระจก (3–4) → ครูหาผ้าห่มและน้ำอุ่นไม่ได้ (5–6) → เด็กหนาวก่อนหลับ (7) → ตีสามลุงเอาถุงนอนและน้ำอุ่นมาให้ (8–9) → รู้ว่าลุงไม่เหลือให้ตัวเอง (10) → ความทรงจำเรื่องลูกสาว (11) → เด็กเอาผ้าพันคอมาห่มให้ลุง (12) → แสงแรกกับเหรียญรางวัล (13) → ได้ขึ้นเครื่องพร้อมรอยยิ้ม (14–15)", "grade_name": "WINTER TERMINAL SLATE-AMBER", "ref_mode": "file", "cast": [{"id": "CHAR-A", "role": "ครูพี่เลี้ยงของคณะนักเรียน", "age": "34–38", "height": 162, "file": "02_CHAR-A_ref"}, {"id": "CHAR-B", "role": "นักเรียน ม.ปลาย กลับจากการแข่งขัน", "age": "15–17", "height": 166, "file": "04_CHAR-B_ref"}, {"id": "CHAR-C", "role": "ลุงผู้โดยสารคนไทยร่วมเที่ยวบิน", "age": "56–62", "height": 173, "file": "06_CHAR-C_ref"}, {"id": "CHAR-D", "role": "พนักงานภาคพื้นสนามบิน", "age": "26–32", "height": 160, "file": "08_CHAR-D_ref"}], "master_lock": "[MASTER LOCK — FOUR DEGREES AT THE GATE / คืนสี่องศาหน้าเกต]\nSTYLE: photorealistic live-action Thai airport human drama, cinematic winter realism, 9:16, 24fps, shallow depth of field.\nCHARACTER LOCK: CHAR-A, CHAR-B, CHAR-C, CHAR-D match their references in every scene. No identity, face, hairstyle, wardrobe or accessory drift.\nCOLOUR LOCK: Palette (same in every scene): cool winter slate-blue, muted warm amber light, dark navy and olive coats, soft terrazzo grey, natural warm skin. Wardrobe and props exactly as in the references, never shifting between shots or scenes. Same grade and same skin tone in every shot and every scene. No colour flicker, no oversaturation, no grade change between scenes; only the real light of the time of day changes.\nONE GRADE FOR ALL 15 SCENES: WINTER TERMINAL SLATE-AMBER. One grade for the whole film: cinematic winter terminal slate-amber. Cool slate-blue glass and terrazzo shadows, muted warm amber interior practicals, deep navy and olive winter fabrics, natural warm skin tones, soft filmic contrast, very light film grain.\nTIME OF DAY: late night 23:30–01:30 in scenes 01–06, dimmed deep night 02:10–03:40 in scenes 07–12, pale winter dawn 06:15–07:00 in scenes 13–15. Light follows the real time of day, the colour grade never changes.\nLENS LOCK: 35mm for wides and corridor tracking, 50mm for mediums, 85mm for close-ups; natural shallow depth of field; subtle handheld only, no whip pans, no zoom tricks.\nSCREEN DIRECTION: Geography lock: the tall terminal window is on frame-left and the concrete pillar on frame-right in every wide shot of the gate lounge; in two-shots the first-listed character of the scene's reference map stays frame-left.\nSCARF CONTINUITY LOCK: the plain cream knit scarf from PROP-A starts hidden inside CHAR-A's tote bag (not visible in scenes 01–02), is given to CHAR-B in scene 03, stays on CHAR-B through scenes 04–11, is draped onto CHAR-C in scene 12, stays on CHAR-C in scenes 13–14, and is returned folded to CHAR-A in scene 15.\nSLEEPING BAG LOCK: CHAR-C picks up two dark-navy sleeping bags in scene 02; CHAR-A gets one. By scene 08, CHAR-C drapes one over CHAR-B and has already given the other to another child off-screen, leaving CHAR-C with zero sleeping bags in scenes 10–12.\nBLANK SCREEN & SIGNAGE LOCK: every airport flight board, gate monitor, vending panel, boarding pass, hand-warmer packet, medal and uniform is completely blank with zero readable text, numbers, letters or logos.\nCROWD LOCK: only the named characters appear in focus; the terminal is quiet at night with at most a few deeply blurred, silent sleeping figures far in the background.\nRESPECT LOCK: no real airline, airport, school or person is named; no villain or accusation—CHAR-D is courteous and helpful throughout.\nPROP LOCK: prop sheets are attached only in the scenes that use them (16_PROP-A_CAMP; 17_PROP-B_COUNTER). Props match their sheet exactly in every shot; a prop sheet never defines a character.\nSOUND LOCK: dialogue and natural SFX only. Layers per scene: soft terminal HVAC hum, quiet footsteps on terrazzo, nylon sleeping bags rustling, hot water pouring into thermos, zipper, gentle winter wind against glass, bag straps and footsteps at dawn. NO MUSIC, NO NARRATION.\nDIALOGUE LOCK: only the written Thai lines, no added words, no paraphrase, no reorder, no overlap.\nSCREEN LOCK: no readable text, numbers, logos, flight codes or printed words on any display board, monitor, uniform, cup, pouch, medal, clipboard or boarding pass.\nNEGATIVE: No subtitles, captions, text overlays, logo or watermark. No readable text, letters, numbers, flight screens, signs, airline branding or name badges anywhere. No extra people in focus. No extra dialogue. No face morphing, wardrobe change or sudden location change. No lens flare, no cartoon style.", "assets_prompt": "You are the art department for a short film called \"FOUR DEGREES AT THE GATE\". Create the complete asset pack below: 17 photorealistic images, in the exact order listed.\n\nOUTPUT & NAMING RULES (IMPORTANT FOR GOOGLE FLOW / PROJECT LIBRARY)\n- Before each image, write its exact asset name on its own line as plain text (for example: 01_CHAR-A_sheet). Never put any text inside an image.\n- IMMEDIATELY after generating each image, save/rename that asset in this project using its EXACT asset name (e.g., 02_CHAR-A_ref, 10_LOC-1_GATE_NIGHT, 16_PROP-A_CAMP) with no extra words, prefixes or suffixes, so later video scenes can select it directly by name.\n- Aspect ratios: sheets 16:9, portraits and locations 9:16, prop sheets 16:9.\n- If you can only create a few images per reply, create and name them in order in batches and stop; continue when I reply \"ต่อ\". Never skip or reorder.\n- Where an image says USE REF, select and attach the named earlier project asset as the exact reference, keeping identity, layout and wardrobe identical.\n\nGLOBAL STYLE\nPhotorealistic, natural skin and material texture, realistic proportions, sharp focus. Film colour feel: cool winter slate-blue terminal glass and terrazzo shadows, muted warm amber interior glow, deep navy and olive coats, natural warm skin, soft filmic contrast.\nNEGATIVE (all images): no text, letters, numbers, signage, labels, logos, brand marks, watermarks, captions; no extra fingers or distorted hands; no face morphing; no cartoon, illustration or 3D-render look.\n\nCAST (fixed identity and wardrobe for the whole film)\nA: Thai woman, mid-30s, slim build, 162 cm, shoulder-length straight black hair tied loosely back, natural minimal makeup, warm tired expressive eyes. Tailored dark-charcoal wool knee-length winter coat over a plain black knit sweater, black trousers, clean plain white sneakers, plain black canvas tote bag slung over the shoulder with no logo.\nB: Thai teenage boy, 16, slender youthful build, 166 cm, neat short black hair, clear skin, earnest bright eyes. Plain dark-navy athletic zip-up track jacket with no logo or lettering over a plain white cotton tee, matching plain dark-navy track pants, grey sneakers, plain black nylon backpack.\nC: Thai man, late 50s, sturdy average build, 173 cm, short salt-and-pepper hair, thin rimless glasses, weathered calm face with deep eye lines. Plain dark-olive quilted winter jacket over a plain black turtleneck sweater, dark-grey wool trousers, worn dark-brown leather walking shoes, no logos.\nD: East Asian woman, late 20s, petite neat build, 160 cm, black hair styled in a tidy low bun, gentle polite tired eyes. Plain dark-navy tailored blazer with no name badge or airline logo, pale-blue silk neck scarf, plain white blouse underneath, dark-navy trousers, plain black low-heel shoes.\n\nCHARACTER IMAGES\nSheet template: 16:9 turnaround sheet on a plain light-grey seamless background, even soft studio light. Top row four full-body views (front, three-quarter, side, back). Bottom row three head-and-shoulders portraits with three expressions. Identical face, hair, build and wardrobe in all views.\nRef template: 9:16 full-body portrait, standing relaxed facing the camera, arms at sides, neutral expression, plain light-grey seamless background, soft even light, 85mm look, full body from head to feet in frame.\n01_CHAR-A_sheet: sheet template for A. Expressions: neutral, quiet concern, gentle warm smile.\n02_CHAR-A_ref: ref template for A. USE REF 01_CHAR-A_sheet.\n03_CHAR-B_sheet: sheet template for B. Expressions: neutral, brave faint smile, sleepy relief.\n04_CHAR-B_ref: ref template for B. USE REF 03_CHAR-B_sheet.\n05_CHAR-C_sheet: sheet template for C. Expressions: neutral stern, quiet warmth, proud gentle smile.\n06_CHAR-C_ref: ref template for C. USE REF 05_CHAR-C_sheet.\n07_CHAR-D_sheet: sheet template for D. Expressions: neutral polite, sincere apology, relieved warm smile.\n08_CHAR-D_ref: ref template for D. USE REF 07_CHAR-D_sheet.\n09_LINEUP_height: USE REF 02_CHAR-A_ref, 04_CHAR-B_ref, 06_CHAR-C_ref, 08_CHAR-D_ref. 16:9 group line-up of A, B, C, D side by side facing the camera on a plain light-grey background, full bodies visible, plain unmarked height backdrop, relative heights exactly as in CAST (A 162 cm, B 166 cm, C 173 cm, D 160 cm).\n\nLOCATIONS AND PROPS\nSET-1 (gate waiting area): modern international airport departure gate lounge. Tall floor-to-ceiling glass wall on the left overlooking a dark winter tarmac with faint mist, rows of sleek grey metal airport bench seats, wide polished light-grey terrazzo floor, a smooth grey concrete pillar on the right, a dark blank rectangular flight monitor on the far wall with zero readable text or numbers. Wide eye-level shot down the lounge. No pe const KEY = "tss_dash_v1_" + D.prefix;
const loadState = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
let S = loadState();
if (!S.scenes) S.scenes = {};
if (!S.ends) S.ends = {};
if (!S.assets) S.assets = {};
const saveState = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 1600);
}
async function copyText(text, btn, label="คัดลอกแล้ว") {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast(label);
  if (btn) {
    const old = btn.textContent;
    btn.classList.add("copied"); btn.textContent = "✓ คัดลอกแล้ว";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = old; }, 1300);
  }
}

function renderHeader() {
  document.getElementById("h-title").textContent = `${D.title_th} (${D.title_en})`;
  document.getElementById("h-sub").textContent = `${D.genre} • ${D.logline}`;
  const hg = D.hook.grade === "A" ? "ok" : (D.hook.grade === "B" ? "warn" : "bad");
  document.getElementById("h-badges").innerHTML = `
    <span class="badge accent">🎨 ${esc(D.grade_name)}</span>
    <span class="badge">⏱ ${D.scenes.length} ฉาก × 10.00s = ${D.scenes.length*10}s</span>
    <span class="badge">📁 โหมดอ้างอิง: ${esc(D.ref_mode)}</span>
    <span class="badge ${hg}">⚡ Hook Score: ${D.hook.score}/100 (Grade ${D.hook.grade})</span>
  `;
  const aDone = D.assets.filter(a => S.assets[a.name]).length;
  const sDone = D.scenes.filter(sc => S.scenes[sc.num]).length;
  const eDone = D.scenes.filter(sc => sc.end_name && S.ends[sc.num]).length;
  const eTot = D.scenes.filter(sc => sc.end_name).length;
  document.getElementById("h-stats").innerHTML = `
    <div class="stat"><div class="k">Assets QA ผ่านแล้ว</div><div class="v">${aDone} / ${D.assets.length}</div><div class="pbar"><span style="width:${(aDone/D.assets.length*100).toFixed(0)}%"></span></div></div>
    <div class="stat"><div class="k">Scenes เจนผ่านแล้ว</div><div class="v">${sDone} / ${D.scenes.length}</div><div class="pbar"><span style="width:${(sDone/D.scenes.length*100).toFixed(0)}%"></span></div></div>
    <div class="stat"><div class="k">เซฟเฟรมท้าย (SXX_END)</div><div class="v">${eDone} / ${eTot}</div><div class="pbar"><span style="width:${(eDone/Math.max(1,eTot)*100).toFixed(0)}%"></span></div></div>
    <div class="stat"><div class="k">Hook วิแรก (S01 พูดตอน)</div><div class="v">${D.hook.first_dlg_at !== null ? D.hook.first_dlg_at.toFixed(2)+'s' : 'ไม่มีบทพูด'}</div><div class="k" style="margin-top:4px">เป้า TikTok: ≤ 1.50s</div></div>
  `;
}

let fStatus = "all", fChar = "all", fQuery = "";
function renderScenes() {
  const el = document.getElementById("tab-scenes");
  const chars = D.cast.map(c => c.id);
  const filtered = D.scenes.filter(sc => {
    if (fStatus === "todo" && S.scenes[sc.num]) return false;
    if (fStatus === "done" && !S.scenes[sc.num]) return false;
    if (fChar !== "all" && !sc.chars.includes(fChar)) return false;
    if (fQuery && !(sc.title + " " + sc.loc + " " + sc.prompt).toLowerCase().includes(fQuery.toLowerCase())) return false;
    return true;
  });

  el.innerHTML = `
    <div class="toolbar">
      <input id="q-search" type="search" placeholder="ค้นหาฉาก / บทพูด / สถานที่..." value="${esc(fQuery)}" style="flex:1;min-width:200px" />
      <select id="q-status">
        <option value="all" ${fStatus==="all"?"selected":""}>ทุกสถานะ (${D.scenes.length})</option>
        <option value="todo" ${fStatus==="todo"?"selected":""}>ยังไม่เสร็จ</option>
        <option value="done" ${fStatus==="done"?"selected":""}>เจนผ่านแล้ว</option>
      </select>
      <select id="q-char">
        <option value="all">ตัวละครทั้งหมด</option>
        ${chars.map(c => `<option value="${c}" ${fChar===c?"selected":""}>${c}</option>`).join("")}
      </select>
    </div>
    <div id="scene-list"></div>
  `;
  document.getElementById("q-search").oninput = e => { fQuery = e.target.value; renderScenes(); };
  document.getElementById("q-status").onchange = e => { fStatus = e.target.value; renderScenes(); };
  document.getElementById("q-char").onchange = e => { fChar = e.target.value; renderScenes(); };

  const list = document.getElementById("scene-list");
  filtered.forEach(sc => {
    const done = !!S.scenes[sc.num];
    const endDone = !!S.ends[sc.num];
    const card = document.createElement("div");
    card.className = "card" + (done ? " done" : "");
    const segs = sc.shots.map(sh => {
      const pct = (sh.dur / 10 * 100).toFixed(2);
      const cls = sh.spk ? "talk" : "silent";
      const lbl = sh.spk ? `${sh.spk} (${sh.dur}s)` : `เงียบ ${sh.dur}s`;
      return `<div class="seg ${cls}" style="width:${pct}%" title="Shot ${sh.i} (${sh.a.toFixed(2)}-${sh.b.toFixed(2)}s): ${esc(sh.line || sh.act)}">${lbl}</div>`;
    }).join("");
    const dlgs = sc.shots.filter(sh => sh.spk).map(sh => `

        <span>“${esc(sh.line)}”</span>

    card.innerHTML = `

            <div class="scene-meta">${esc(sc.time)} • ${esc(sc.loc)} • อารมณ์: ${esc(sc.beat)} • แนบ ${sc.refs.length} รูป</div>
          </div>
        </div>
        <div class="actions">
          <label class="chk"><input type="checkbox" class="cb-done" ${done?"checked":""}/> เจนผ่าน</label>
          ${sc.end_name ? `<label class="chk"><input type="checkbox" class="cb-end" ${endDone?"checked":""}/> เซฟ ${sc.end_name}</label>` : ""}

      <div class="tbar">${segs}</div>

    card.querySelector(".btn-copy").onclick = e => copyText(sc.prompt, e.currentTarget, `คัดลอก Scene ${String(sc.num).padStart(2,"0")} แล้ว`);
    card.querySelector(".cb-done").onchange = e => { S.scenes[sc.num] = e.target.checked; saveState(); renderHeader(); renderScenes(); };
    const cbEnd = card.querySelector(".cb-end");
    if (cbEnd) cbEnd.onchange = e => { S.ends[sc.num] = e.target.checked; saveState(); renderHeader(); };
    list.appendChild(card);
  });
}

function renderHook() {
  const el = document.getElementById("tab-hook");
  const H = D.hook;
  const s1 = D.scenes[0];
  const hg = H.grade === "A" ? "ok" : (H.grade === "B" ? "warn" : "bad");
  const segs = s1.shots.map(sh => {
    const pct = (sh.dur / 10 * 100).toFixed(2);
    const cls = sh.spk ? "talk" : "silent";
    return `<div class="seg ${cls}" style="width:${pct}%">S1.${sh.i} (${sh.a.toFixed(1)}-${sh.b.toFixed(1)}s)</div>`;
  }).join("");

  el.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="scene-title">⚡ ตัวตรวจ Hook 3 วินาทีแรก & จังหวะการดูจบ (TikTok / Reels / Shorts)</div>
          <div class="scene-meta">ตรวจเวลาเปิดบทพูดแรกของ Scene 01, จังหวะการตัดช็อต และความเร็วพูดตลอด 150 วินาที</div>
        </div>
        <span class="badge ${hg}" style="font-size:15px;padding:6px 14px">คะแนน ${H.score}/100 (Grade ${H.grade})</span>
      </div>
      <div class="stats" style="margin-top:12px">
        <div class="stat"><div class="k">ช็อตแรกตัดที่</div><div class="v">${H.first_cut.toFixed(2)}s</div><div class="k">แนะนำ ≤ 2.00s</div></div>
        <div class="stat"><div class="k">บทพูดแรกเริ่มที่</div><div class="v">${H.first_dlg_at !== null ? H.first_dlg_at.toFixed(2)+'s' : 'ไม่มี'}</div><div class="k">แนะนำ ≤ 1.50s</div></div>
        <div class="stat"><div class="k">ความยาวช็อตเฉลี่ยทั้งเรื่อง</div><div class="v">${H.avg_shot.toFixed(2)}s</div><div class="k">เป้าหนังสั้น: 1.6–2.4s</div></div>
        <div class="stat"><div class="k">ความเร็วพูดสูงสุด</div><div class="v">${H.max_rate.rate.toFixed(1)} ก-ฮ/วิ</div><div class="k">Scene ${String(H.max_rate.scene).padStart(2,'0')} (เพดาน 9.0)</div></div>
      </div>

      <div style="margin-top:16px;font-weight:700;font-size:13px">ไทม์ไลน์ Scene 01 (0.00s → 10.00s) เทียบเส้นตัดสินใจคนดู 1.5s และ 3.0s</div>
      <div class="hook-bar">
        ${segs}
        <div class="marker" style="left:15%;background:var(--warn)"><span style="color:var(--warn)">1.5s เป้าเปิดพูด</span></div>
        <div class="marker" style="left:30%;background:var(--bad)"><span style="color:var(--bad)">3.0s เส้นตัดฟีด</span></div>
      </div>
      ${H.first_dlg_line ? `<div class="dlg-row"><span class="dlg-t">${H.first_dlg_at.toFixed(2)}s</span><span class="dlg-s">${esc(H.first_dlg_spk)}</span><span>ประโยคเปิด: “${esc(H.first_dlg_line)}”</span></div>` : ""}

      <div style="margin-top:14px;font-weight:700;font-size:13px">ผลการตรวจ & คำแนะนำ</div>
      <div style="margin-top:6px">
        ${H.warnings.length ? H.warnings.map(([sev, msg]) => `
          <div class="warn-item ${sev}">
            <span>${sev==="high"?"🔴":sev==="medium"?"🟡":"🔵"}</span>
            <span>${esc(msg)}</span>
          </div>
        `).join("") : '<div class="warn-item" style="border-color:rgba(34,197,94,.5)">🟢 ผ่านเกณฑ์ Hook & Pacing ทุกข้อ</div>'}
        ${H.tips.length ? `<div style="margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--border)"><div style="font-weight:700;font-size:12.5px;color:var(--accent2);margin-bottom:4px">💡 แนวทางปรับให้ดึงคนดูอยู่หมัดขึ้น</div><ul style="margin:0;padding-left:18px">${H.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      </div>
    </div>

    <div class="card">
      <div class="scene-title" style="margin-bottom:10px">ตารางจังหวะรายฉาก (15 Scenes)</div>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Scene</th><th>ชื่อฉาก</th><th>จำนวนช็อต</th><th>เปิดพูดที่</th><th>ช็อตยาวสุด</th><th>ความเร็วพูดสูงสุด</th><th>อารมณ์</th></tr></thead>
          <tbody>
            ${H.per_scene.map(r => `
              <tr>
                <td><strong>${String(r.num).padStart(2,"0")}</strong></td>
                <td>${esc(r.title)}</td>
                <td>${r.shots}</td>
                <td>${r.first_dlg !== null ? r.first_dlg.toFixed(2)+"s" : "เงียบทั้งฉาก"}</td>
                <td style="${r.longest_shot>3.8?'color:var(--warn);font-weight:700':''}">${r.longest_shot.toFixed(2)}s</td>
                <td style="${r.max_rate>8.5?'color:var(--warn);font-weight:700':''}">${r.max_rate>0?r.max_rate.toFixed(1)+' ก-ฮ/วิ':'—'}</td>
                <td>${esc(r.beat)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

        <ul style="margin:0;padding-left:18px;color:var(--muted)">

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById("tab-" + t.dataset.tab).classList.add("active");
});
document.getElementById("btn-theme").onclick = () => {
  document.body.classList.toggle("light");
  S.light = document.body.classList.contains("light");
  saveState();
};
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("รีเซ็ตการติ๊กสถานะทั้งหมดของเรื่องนี้?")) return;
  S = { scenes: {}, ends: {}, assets: {}, light: S.light };
  saveState();
  renderHeader(); renderScenes(); renderAssets();
};
if (S.light) document.body.classList.add("light");
renderHeader(); renderScenes(); renderAssets(); renderHook(); renderBible(); renderPost();
</script>
</body>
